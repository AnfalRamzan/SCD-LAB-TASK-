<!DOCTYPE html>
<html>
<head>
  <title>Student Portal Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #0056b3;
    }
    .links {
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
    }
    .links a {
      color: #007bff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Student Portal Login</h2>
    <form onsubmit="return login()">
      <input type="text" id="studentId" placeholder="Student ID / Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <div class="links">
      <a href="#">Forgot Password?</a> | <a href="#">Contact Admin</a>
    </div>
  </div>

  <script>
    function login() {
      const id = document.getElementById('studentId').value;
      const pass = document.getElementById('password').value;

      // Basic demo check (replace with real authentication)
      if (id === "student" && pass === "12345") {
        alert("Login successful! Welcome, " + id);
        // window.location.href = "dashboard.html";
      } else {
        alert("Invalid Student ID or Password. Please try again.");
      }
      return false; // prevent form submission
    }
  </script>
</body>
</html>
